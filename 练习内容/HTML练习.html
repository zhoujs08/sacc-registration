<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./CSS练习.css">
    <!-- 引入tailwind资源 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body>
    <h1 class="bg-blue-500 text-white" >南京原神大学</h1>标签大小
    <h2>二级标题</h2>
    <h3>三级标题</h3>
    <i><p>纳西妲</p></i>
    <!-- 斜体 -->
    <b><p>纳西妲</p></b>
    <!-- 加粗 -->
    <u><p>纳西妲</p></u>
    <!-- 下划线 -->
    <s><p>纳西妲</p></s>
    <!-- 删除线 -->
    <p>纳西妲</p>
    <p>纳西妲</p>
    换行<br>换行
    <hr>
  <img src="./屏幕截图 2026-08-19 162807.png" alt="纳西妲" titlle="纳西妲" width="200" height="200">
  <img src="./屏幕截图 2026-08-19 162807.png" alt=".">
  <a href="https://www.yuanshen.com/#/" target="_blank">原神，启动！</a>
  <audio src="#" controls loop autoplay></audio>
  <!-- <video src="" controls loop autoplay muted></video>控制，自动循环，自动播放，循环播放，静音播放（网页不允许自动播放有声音的） -->
   <table>
        <tr>
            <th>姓名</th>
            <th>学号</th>
            <th>手机号</th>
            <th>学院</th>
            <th>专业</th>
            <th>邮箱</th>
        </tr>
        <tr>
          <td>
            纳西妲
          </td>
          <td>
            10086
          </td>
          <td>

          </td>

          </td>
          <td>
            花车颠呀颠
          </td>
          <td>
            纳西妲睁开眼
          </td>
        </tr>
    </table>
        <!-- action: 表单提交的服务器地址, method: HTTP请求方式(post/get) -->
<form id="myform">
    <!-- 文本输入框: label的for属性关联input的id, 点击label自动聚焦input -->
    <label for="name">姓名：</label>
    <input type="text" id="name" placeholder="请输入姓名"><br>
    <!-- 密码输入框: type="password" 会隐藏输入内容 -->
    <label for="pwd">密码：</label>
    <input type="password" id="pwd"><br>
    性别：
    <!-- 单选框: 相同name属性互斥, 只能选中一个 -->
    <input type="radio" name="gender" value="male" id="male">
    <label for="male">男</label>
    <input type="radio" name="gender" value="female" id="female">
    <label for="female">女</label><br>
    爱好：
    <!-- 复选框: 相同name属性归为一组, 可多选 -->
    <input type="checkbox" name="hobby" value="eat" id="eat">
    <label for="eat">吃饭</label>
    <input type="checkbox" name="hobby" value="sleep" id="sleep">
    <label for="sleep">睡觉</label><br>
    <!-- 提交按钮: 将表单数据发送到action指定的地址 -->
    <button type="submit" class="tijiao">提交</button>
    <!-- 重置按钮: 清空所有输入, 恢复默认值 -->
    <button type="reset" id="anniu">重置</button>
    <p>你点击了<span id="jishu">0</span>次</p>
    <!-- js编译区 -->
    <script>
      const form = document.querySelector("#myform");
  const display = document.querySelector("#jishu");

  let count = 0;

  form.addEventListener("submit", function (event) {
    // 阻止表单跳转到其他页面
    event.preventDefault();

    count = count + 1;
    display.textContent = count;

    alert("提交成功！");
  });
    </script>
    
</form>
</body>
</html>
